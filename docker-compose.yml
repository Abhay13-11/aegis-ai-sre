version: '3.8'

services:
  aegis-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-sre-platform
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=local-sandbox
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
